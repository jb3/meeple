[package]
name = "meeple"
version = "0.1.0"
edition = "2021"
description = "An ambient, procedurally generated isometric voxel world."
license = "MIT"

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
glam = "0.29"
console_error_panic_hook = "0.1"
wide = "1.7.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "Node",
  "CssStyleDeclaration", "DomTokenList", "console", "Location", "UrlSearchParams", "Performance",
  "Event", "EventTarget", "KeyboardEvent", "MouseEvent", "WheelEvent",
  "TouchEvent", "TouchList", "Touch",
  "WebGl2RenderingContext", "WebGlProgram", "WebGlShader", "WebGlBuffer",
  "WebGlVertexArrayObject", "WebGlUniformLocation", "WebGlFramebuffer", "WebGlTexture",
  "CanvasRenderingContext2d", "ImageData", "Navigator", "Clipboard", "History", "Storage",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 2
